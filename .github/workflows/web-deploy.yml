name: Web Deploy

# Only reachable from the Web workflow, after its tests and the E2E suite have passed.
on:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    outputs:
      deployment-matrix: ${{ steps.export-deployment-matrix.outputs.deployment-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      - name: Create .env file
        env:
          NUXT_ENV: ${{ secrets.NUXT_ENV }}
        run: printf "%s" "$NUXT_ENV" > .env

      # GITHUB_SHA is baked into the build as the footer's commit link
      - name: Build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Create deployment artifact
        run: tar -czf "$RUNNER_TEMP/${GITHUB_SHA}.tar.gz" .output node_modules deploy ecosystem.config.js package.json yarn.lock

      - name: Delete the previous web artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Scoped by name: the API deploy shares this repo's artifact store
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'web-build',
            })
            await Promise.all(data.artifacts.map(({ id }) =>
              github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: id })))

      - name: Store artifact for distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: ${{ runner.temp }}/${{ github.sha }}.tar.gz
          retention-days: 7

      - name: Export deployment matrix
        id: export-deployment-matrix
        run: |
          delimiter="$(openssl rand -hex 8)"
          {
            echo "deployment-matrix<<${delimiter}"
            cat deployment-config.json
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  release:
    name: '${{ matrix.server.name }}: Release'
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        server: ${{ fromJson(needs.build.outputs.deployment-matrix) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build

      - name: Upload
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ github.sha }}.tar.gz
          target: ${{ matrix.server.path }}/artifacts

      - name: Activate release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_PATH: ${{ matrix.server.path }}/releases/${{ github.sha }}
          ACTIVE_RELEASE_PATH: ${{ matrix.server.path }}/current
          BASE_PATH: ${{ matrix.server.path }}
          NUXT_ENV: ${{ secrets.NUXT_ENV }}
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          command_timeout: 30m
          envs: GITHUB_SHA,RELEASE_PATH,ACTIVE_RELEASE_PATH,BASE_PATH,NUXT_ENV
          script: |
            set -e
            mkdir -p "$RELEASE_PATH"
            tar xzf "$BASE_PATH/artifacts/$GITHUB_SHA.tar.gz" -C "$RELEASE_PATH"
            bash "$RELEASE_PATH/deploy/activate.sh"

  clean-up:
    name: '${{ matrix.server.name }}: Clean up'
    runs-on: ubuntu-latest
    needs: [build, release]
    strategy:
      matrix:
        server: ${{ fromJson(needs.build.outputs.deployment-matrix) }}
    steps:
      - name: Keep the two most recent releases
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASES_PATH: ${{ matrix.server.path }}/releases
          ARTIFACTS_PATH: ${{ matrix.server.path }}/artifacts
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          envs: RELEASES_PATH,ARTIFACTS_PATH
          script: |
            set -eu
            : "${RELEASES_PATH:?}" "${ARTIFACTS_PATH:?}"
            cd "$RELEASES_PATH" && ls -t -1 | tail -n +3 | xargs -r rm -rf
            cd "$ARTIFACTS_PATH" && ls -t -1 | tail -n +3 | xargs -r rm -rf
