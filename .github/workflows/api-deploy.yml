name: API Deploy

# Only reachable from the API workflow, after its tests and the E2E suite have passed.
on:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    outputs:
      deployment-matrix: ${{ steps.export-deployment-matrix.outputs.deployment-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish Portfolio.Api -c Release

      # Self-contained migrations bundle so the server never has to restore/build
      - name: Build migrations bundle
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet restore Portfolio.Api -r linux-x64
          dotnet ef migrations bundle --project Portfolio.Api --configuration Release --runtime linux-x64 --self-contained -o efbundle

      - name: Create deployment artifact
        run: tar -czf "$RUNNER_TEMP/${GITHUB_SHA}.tar.gz" --exclude=./Portfolio.Api.Tests --exclude=./Portfolio.Api/obj .

      - name: Delete the previous API artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Scoped by name: the web deploy shares this repo's artifact store
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'api-build',
            })
            await Promise.all(data.artifacts.map(({ id }) =>
              github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: id })))

      - name: Store artifact for distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-build
          path: ${{ runner.temp }}/${{ github.sha }}.tar.gz
          retention-days: 7

      - name: Export deployment matrix
        id: export-deployment-matrix
        run: |
          delimiter="$(openssl rand -hex 8)"
          {
            echo "deployment-matrix<<${delimiter}"
            cat Portfolio.Api/deployment-config.json
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  release:
    name: '${{ matrix.server.name }}: Release'
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        server: ${{ fromJson(needs.build.outputs.deployment-matrix) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-build

      - name: Upload
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ github.sha }}.tar.gz
          target: ${{ matrix.server.path }}/artifacts

      - name: Activate release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_PATH: ${{ matrix.server.path }}/releases/${{ github.sha }}
          ACTIVE_RELEASE_PATH: ${{ matrix.server.path }}/current
          BASE_PATH: ${{ matrix.server.path }}
          ROOT_PATH: ${{ matrix.server.path }}/wwwroot
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          VERTEX_AI_CREDENTIALS_JSON: ${{ secrets.VERTEX_AI_CREDENTIALS_JSON }}
          VERTEX_AI_PROJECT_ID: ${{ secrets.VERTEX_AI_PROJECT_ID }}
          VERTEX_AI_LOCATION: ${{ secrets.VERTEX_AI_LOCATION }}
          VERTEX_AI_COLLECTION: ${{ secrets.VERTEX_AI_COLLECTION }}
          VERTEX_AI_BRANCH: ${{ secrets.VERTEX_AI_BRANCH }}
          VERTEX_AI_ENVIRONMENT: ${{ secrets.VERTEX_AI_ENVIRONMENT }}
          VERTEX_AI_MODEL: ${{ secrets.VERTEX_AI_MODEL }}
          VERTEX_AI_MODEL_LOCATION: ${{ secrets.VERTEX_AI_MODEL_LOCATION }}
          VERTEX_AI_QUERY_DATASTORE_SUFFIX: ${{ secrets.VERTEX_AI_QUERY_DATASTORE_SUFFIX }}
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          command_timeout: 30m
          envs: GITHUB_SHA,RELEASE_PATH,ACTIVE_RELEASE_PATH,BASE_PATH,ROOT_PATH,DATABASE_CONNECTION_STRING,AUTH0_DOMAIN,AUTH0_CLIENT_ID,AUTH0_AUDIENCE,VERTEX_AI_CREDENTIALS_JSON,VERTEX_AI_PROJECT_ID,VERTEX_AI_LOCATION,VERTEX_AI_COLLECTION,VERTEX_AI_BRANCH,VERTEX_AI_ENVIRONMENT,VERTEX_AI_MODEL,VERTEX_AI_MODEL_LOCATION,VERTEX_AI_QUERY_DATASTORE_SUFFIX
          script: |
            set -e
            mkdir -p "$RELEASE_PATH"
            tar xzf "$BASE_PATH/artifacts/$GITHUB_SHA.tar.gz" -C "$RELEASE_PATH"
            bash "$RELEASE_PATH/deploy/activate.sh"

  clean-up:
    name: '${{ matrix.server.name }}: Clean up'
    runs-on: ubuntu-latest
    needs: [build, release]
    strategy:
      matrix:
        server: ${{ fromJson(needs.build.outputs.deployment-matrix) }}
    steps:
      - name: Keep the two most recent releases
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASES_PATH: ${{ matrix.server.path }}/releases
          ARTIFACTS_PATH: ${{ matrix.server.path }}/artifacts
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          envs: RELEASES_PATH,ARTIFACTS_PATH
          script: |
            set -eu
            : "${RELEASES_PATH:?}" "${ARTIFACTS_PATH:?}"
            cd "$RELEASES_PATH" && ls -t -1 | tail -n +3 | xargs -r rm -rf
            cd "$ARTIFACTS_PATH" && ls -t -1 | tail -n +3 | xargs -r rm -rf
