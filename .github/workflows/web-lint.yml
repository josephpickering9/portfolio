name: Web Lint
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-lint.yml'
jobs:
  lint:
    name: yarn lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Yarn lint
        run: yarn lint:full
