name: Web Lint & Test
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-lint.yml'
      - 'api/WorkExperienceSearch/Types/ErrorCodes.cs'
jobs:
  lint:
    name: yarn lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Yarn lint
        run: yarn lint:full

      - name: Yarn typecheck
        run: yarn typecheck

      - name: Yarn test
        run: yarn test
