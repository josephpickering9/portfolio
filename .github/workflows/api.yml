name: API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  test:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/coverage"

      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.8
          reportgenerator \
            -reports:"$RUNNER_TEMP/coverage/**/coverage.cobertura.xml" \
            -targetdir:"$RUNNER_TEMP/coverage/report" \
            -reporttypes:MarkdownSummaryGithub \
            -classfilters:"-Portfolio.Api.Migrations.*"
          cat "$RUNNER_TEMP/coverage/report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Deploy
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Queue rather than overlap, so one run never deletes an artifact another run is still using
    concurrency:
      group: api-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/api-deploy.yml
    secrets: inherit
