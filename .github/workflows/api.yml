name: API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  test:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/coverage"

      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.8
          reportgenerator \
            -reports:"$RUNNER_TEMP/coverage/**/coverage.cobertura.xml" \
            -targetdir:"$RUNNER_TEMP/coverage/report" \
            -reporttypes:MarkdownSummaryGithub \
            -classfilters:"-Portfolio.Api.Migrations.*"
          cat "$RUNNER_TEMP/coverage/report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Deploy
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Queue rather than overlap, so one run never deletes an artifact another run is still using
    concurrency:
      group: api-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/api-deploy.yml
    secrets: inherit
