name: Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/Portfolio.Api/Types/ErrorCodes.cs'
      - '.github/workflows/web.yml'
      - '.github/workflows/web-deploy.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'api/Portfolio.Api/Types/ErrorCodes.cs'
      - '.github/workflows/web.yml'
      - '.github/workflows/web-deploy.yml'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, unit tests & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint:full

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:coverage

      - name: Coverage summary
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Deploy
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Queue rather than overlap, so one run never deletes an artifact another run is still using
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/web-deploy.yml
    secrets: inherit
